steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/workcrew-revamped:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/workcrew-revamped:latest'
      - '.'

  # Push the image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/workcrew-revamped:$SHORT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    args:
      - 'deploy'
      - 'workcrew-revamped'
      - '--image'
      - 'gcr.io/$PROJECT_ID/workcrew-revamped:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '3600s'
      - '--set-env-vars'
      - 'NEXTAUTH_URL=https://workcrew-revamped-xxxxxxxx-uc.a.run.app,NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/workcrew-revamped:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/workcrew-revamped:latest'

timeout: '3600s'
options:
  machineType: 'N1_HIGHCPU_8'
